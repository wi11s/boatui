<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boat Scene</title>
  <script type="module" src="boat-scene.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      box-sizing: border-box;
      background: #eef2f4;
      font-family: system-ui, sans-serif;
    }
    boat-scene {
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgb(20 50 70 / 0.25);
    }
    .copy { padding: 36px 28px; color: #183b4e; }
    .copy h1 { margin: 0 0 8px; font-size: 1.8rem; line-height: 1.15; }
    .copy p  { margin: 0; opacity: 0.8; }
  </style>
</head>
<body>
  <boat-scene duration="40">
    <div class="copy">
      <h1>Slow crossings</h1>
      <p>A calm little boat, drifting left to right.</p>
    </div>
  </boat-scene>
</body>
</html>
