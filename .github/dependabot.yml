version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go through dev like every other change, then reach main via the dev -> main PR.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # One PR per week for minor and patch updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
